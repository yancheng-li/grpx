# OLMoE：乘法路径检查（4090 上跑 doctor，不看成绩）。

[model]
name = "allenai/OLMoE-1B-7B-0924-Instruct"
dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
max_new_tokens = 24
temperature = 1.0
max_rows_per_batch = 8
max_tokens_per_batch = 4096

[task]
environment = "examples.arithmetic:ArithmeticEnvironment"
dataset = "examples.arithmetic:make_dataset"
train_dataset_options = { size = 256, seed = 0, digits = 2, operation = "multiplication" }
evaluation_dataset_options = { size = 64, seed = 1, digits = 2, operation = "multiplication" }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 10
groups_per_iteration = 8
learning_rate = 1e-5
warmup_iterations = 2
learning_rate_schedule = "constant"
evaluation_interval = 10
checkpoint_interval = 10
run_name = "olmoe-arith-mul-smoke"
memory_fraction = 0.9
max_tokens_per_minibatch = 1024
max_rows_per_minibatch = 4
shift_measurement_interval = 1
