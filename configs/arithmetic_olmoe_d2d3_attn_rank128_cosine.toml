# OLMoE：注意力 LoRA 秩 128 + cosine 学习率衰减，150 轮。
# 对照恒定学习率下种子 2 在 60 轮后漂走；4090 可跑。

[model]
name = "allenai/OLMoE-1B-7B-0924-Instruct"
dtype = "bfloat16"
lora_rank = 128
lora_alpha = 256
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
max_new_tokens = 16
temperature = 1.0
max_rows_per_batch = 8
max_tokens_per_batch = 4096

[task]
environment = "examples.arithmetic:ArithmeticEnvironment"
dataset = "examples.arithmetic:make_mixed_digit_dataset"
train_dataset_options = { size = 2000, seed = 0, digit_counts = [2, 3] }
evaluation_dataset_options = { size = 200, seed = 1, digit_counts = [2, 3] }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 150
groups_per_iteration = 16
learning_rate = 1e-5
warmup_iterations = 5
learning_rate_schedule = "cosine"
final_learning_rate_fraction = 0.1
evaluation_interval = 10
checkpoint_interval = 30
run_name = "olmoe-arith-d2d3-attn-rank128-cosine"
memory_fraction = 0.9
max_tokens_per_minibatch = 8192
max_rows_per_minibatch = 128
shift_measurement_interval = 1
