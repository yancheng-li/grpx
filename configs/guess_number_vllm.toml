[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
lora_rank = 16
lora_alpha = 32

[backend]
type = "vllm"
base_url = "http://localhost:8000"
max_new_tokens = 32
temperature = 1.0
max_concurrent_requests = 64

[task]
environment = "examples.guess_number:GuessNumberEnvironment"
environment_options = { reveal_interval = true }
dataset = "examples.guess_number:make_dataset"
train_dataset_options = { size = 2000, seed = 0 }
evaluation_dataset_options = { size = 200, seed = 1 }

[training]
algorithm = "grpo"
max_steps = 6
iterations = 5
groups_per_iteration = 16
evaluation_interval = 5
