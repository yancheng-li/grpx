# Qwen3-30B-A3B：本地后端，扫任务难度用（单卡）。
# 正式训练请用 configs/arithmetic_qwen3_moe_vllm.toml。

[model]
name = "Qwen/Qwen3-30B-A3B-Instruct-2507"
dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
max_new_tokens = 24
temperature = 1.0
max_rows_per_batch = 4
max_tokens_per_batch = 2048

[task]
environment = "examples.arithmetic:ArithmeticEnvironment"
dataset = "examples.arithmetic:make_dataset"
# 扫难度时改 digits / operation；乘法 digits 是每个乘数的位数
train_dataset_options = { size = 2000, seed = 0, digits = 4, operation = "multiplication", prompt_variant = "english_strict" }
evaluation_dataset_options = { size = 200, seed = 1, digits = 4, operation = "multiplication", prompt_variant = "english_strict" }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 60
groups_per_iteration = 16
learning_rate = 1e-5
warmup_iterations = 5
learning_rate_schedule = "constant"
evaluation_interval = 10
checkpoint_interval = 20
run_name = "qwen3-moe-arith-local"
device = "cuda:0"
memory_fraction = 0.95
max_tokens_per_minibatch = 1024
max_rows_per_minibatch = 4
shift_measurement_interval = 1
