# OLMoE：两位数 + 三位数各半混合加法（只挂注意力层）。
# 评测集固定 seed=1、各 100 题；日志里 evaluation_environment_success_digits_2/3 分开报。

[model]
name = "allenai/OLMoE-1B-7B-0924-Instruct"
dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
max_new_tokens = 16
temperature = 1.0
# 默认 64 行一批在 4090 上顶满显存，decode 会慢到像卡死；缩小生成批。
max_rows_per_batch = 8
max_tokens_per_batch = 4096

[task]
environment = "examples.arithmetic:ArithmeticEnvironment"
dataset = "examples.arithmetic:make_mixed_digit_dataset"
train_dataset_options = { size = 2000, seed = 0, digit_counts = [2, 3] }
evaluation_dataset_options = { size = 200, seed = 1, digit_counts = [2, 3] }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 60
groups_per_iteration = 16
learning_rate = 1e-5
warmup_iterations = 5
learning_rate_schedule = "constant"
evaluation_interval = 10
checkpoint_interval = 20
run_name = "olmoe-arith-d2d3-attn"
memory_fraction = 0.9
max_tokens_per_minibatch = 1024
max_rows_per_minibatch = 4
shift_measurement_interval = 1
