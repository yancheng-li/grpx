# 四位数加法 + OLMoE：注意力投影挂 LoRA，避开专家层与路由。
# dense 模型请继续省略 lora_target_modules（默认 all-linear）。

[model]
name = "allenai/OLMoE-1B-7B-0924-Instruct"
dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
max_new_tokens = 128
temperature = 1.0

[task]
reward_function = "examples.arithmetic:reward_function"
success_function = "examples.arithmetic:is_correct"
dataset = "examples.arithmetic:make_dataset"
# OLMoE 扫位数后选用 2 位（贪心约 0.34、组内信号约 0.69）；Qwen 快速开始仍用默认 4 位。
train_dataset_options = { size = 2000, seed = 0, digits = 2, prompt_variant = "english_strict" }
evaluation_dataset_options = { size = 200, seed = 1, digits = 2, prompt_variant = "english_strict" }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 30
groups_per_iteration = 16
learning_rate = 1e-5
warmup_iterations = 5
learning_rate_schedule = "constant"
evaluation_interval = 30
checkpoint_interval = 10
run_name = "olmoe-arith-d2-s0"
memory_fraction = 0.9
max_tokens_per_minibatch = 1024
max_rows_per_minibatch = 4
