# OLMoE：两位数 + 三位数混合加法，注意力 LoRA，vLLM 后端。
# 与本地后端注意力组对齐：秩 16、60 轮、小批 128/8192；终点可比 0.619。

[model]
name = "allenai/OLMoE-1B-7B-0924-Instruct"
dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[backend]
type = "vllm"
base_url = "http://localhost:8000"
max_new_tokens = 16
temperature = 1.0
max_concurrent_requests = 64

[task]
environment = "examples.arithmetic:ArithmeticEnvironment"
dataset = "examples.arithmetic:make_mixed_digit_dataset"
train_dataset_options = { size = 2000, seed = 0, digit_counts = [2, 3] }
evaluation_dataset_options = { size = 200, seed = 1, digit_counts = [2, 3] }

[training]
algorithm = "grpo"
max_steps = 1
iterations = 60
groups_per_iteration = 16
learning_rate = 1e-5
warmup_iterations = 5
learning_rate_schedule = "constant"
evaluation_interval = 10
checkpoint_interval = 60
run_name = "olmoe-arith-d2d3-attn-vllm"
memory_fraction = 0.6
max_tokens_per_minibatch = 8192
max_rows_per_minibatch = 128
shift_measurement_interval = 1
